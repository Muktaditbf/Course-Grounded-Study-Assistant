  <g id="Question_field_3" data-name="Question field">
  <rect x="16" y="108" width="358" height="56" rx="18" fill="#F4F5F8" stroke="#EDEEF2" stroke-width="1" />
  <text x="36" y="142" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Why is the sky blue?</text>
  </g>
  <rect x="16" y="176" width="358" height="48" rx="24" fill="#4F46E5" />
  <text x="195" y="205" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ask</text>
  <g id="Answer_4" data-name="Answer">
  <rect x="16" y="244" width="358" height="206" rx="22" fill="#EEF2FF" />
  <path d="M38,264 l4.5,12 l12,4.5 l-12,4.5 l-4.5,12 l-4.5,-12 l-12,-4.5 l12,-4.5 z" fill="#4F46E5" />
  <text x="66" y="284" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="start">Answered from general knowledge</text>
  <text x="38" y="320" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Sunlight contains every colour. Air</text>
  <text x="38" y="340" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">molecules scatter short blue wavelengths far</text>
  <text x="38" y="360" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">more than long red ones, so blue light</text>
  <text x="38" y="380" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">bounces around the sky and reaches your eyes</text>
  <text x="38" y="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">from every direction.</text>
  </g>
  <text x="24" y="486" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#9CA3AF" text-anchor="start">No approved course material covered this, so no sources are listed.</text>
