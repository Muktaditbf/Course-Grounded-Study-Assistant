<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs><linearGradient id="hero" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3730A3"/><stop offset="0.5" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
  <rect id="Background" width="390" height="844" fill="#FAFAFB"/>
  <g id="App_bar_1" data-name="App bar">
  <rect x="0" y="0" width="390" height="92" rx="0" fill="#FFFFFF" />
  <path d="M32,64 L20,56 L32,48 M20,56 H40" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="52" y="62" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="start" letter-spacing="-0.2">CSE341.8 Upload Material</text>
  </g>
  <g id="Status_bar_2" data-name="Status bar">
  <text x="18" y="26" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#111827" text-anchor="start">9:41</text>
  <text x="372" y="26" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#111827" text-anchor="end">5G  100%</text>
  </g>
  <g id="Form_3" data-name="Form">
  <text x="24" y="112" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.4">MATERIAL TITLE</text>
  <rect x="24" y="122" width="342" height="52" rx="16" fill="#F4F5F8" stroke="#EDEEF2" stroke-width="1" />
  <text x="42" y="154" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#111827" text-anchor="start">Lecture 4: TCP Congestion Control</text>
  <text x="24" y="194" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.4">TYPE</text>
  <rect x="24" y="204" width="342" height="52" rx="16" fill="#F4F5F8" stroke="#EDEEF2" stroke-width="1" />
  <text x="42" y="236" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#111827" text-anchor="start">Lecture Slide</text>
  <path d="M340,227 l6,7 l6,-7" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g id="File_picker_4" data-name="File picker">
  <rect x="24" y="276" width="342" height="52" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
  <text x="195" y="308" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#4F46E5" text-anchor="middle">Choose a file</text>
  <text x="195" y="352" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">Pick a PDF, TXT or Markdown file, or paste below.</text>
  </g>
  <g id="Content_5" data-name="Content">
  <text x="24" y="376" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.4">CONTENT</text>
  <rect x="24" y="386" width="342" height="132" rx="16" fill="#F4F5F8" stroke="#EDEEF2" stroke-width="1" />
  <text x="42" y="414" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">TCP congestion control stops a sender from</text>
  <text x="42" y="431" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">flooding the network. Slow start doubles the</text>
  <text x="42" y="448" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">congestion window each round trip until a</text>
  <text x="42" y="465" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">loss occurs.</text>
  </g>
