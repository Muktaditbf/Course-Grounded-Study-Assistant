  <text x="322.6" y="277" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">100%</text>
  <text x="38" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">The waterfall model runs in five sequential</text>
  <text x="38" y="336" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">phases: requirements analysis, system</text>
  <text x="38" y="356" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">design, implementation, testing, and</text>
  <text x="38" y="376" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">maintenance. Each phase must finish before</text>
  <text x="38" y="396" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">the next begins, which makes it predictable</text>
  <text x="38" y="416" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">but hard to revisit.</text>
  </g>
